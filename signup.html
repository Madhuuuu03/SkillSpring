<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SkillSpring</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F46E5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body style="background-color: var(--bg-main);">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" title="Back to Home">
          <span class="brand-logo-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </span>
          <span>SkillSpring</span>
        </a>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Start personalizing your engineering roadmap</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Student Name</label>
          <div class="input-wrapper has-left-icon">
            <span class="input-icon-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input type="text" id="signup-name" class="form-input" placeholder="e.g. Aarav Sharma" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">College or Personal Email</label>
          <div class="input-wrapper has-left-icon">
            <span class="input-icon-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input type="email" id="signup-email" class="form-input" placeholder="student@university.edu" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password</label>
          <div class="input-wrapper has-left-icon has-right-icon">
            <span class="input-icon-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
            </span>
            <input type="password" id="signup-password" class="form-input" placeholder="At least 8 characters" required>
            <button type="button" class="input-icon-right toggle-password-btn" aria-label="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <div class="input-wrapper has-left-icon">
            <span class="input-icon-left">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
            <input type="password" id="signup-confirm-password" class="form-input" placeholder="Re-enter password" required>
          </div>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label class="form-check">
            <input type="checkbox" id="signup-terms" checked required>
            <span style="font-size:0.8125rem; color:var(--text-body);">
              I agree to the <a href="#" style="color:var(--primary); text-decoration:underline;">Terms of Service</a> and <a href="#" style="color:var(--primary); text-decoration:underline;">Privacy Policy</a>
            </span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-bottom:1.25rem;">
          Continue to Student Onboarding →
        </button>

        <div style="text-align:center; font-size:0.875rem; color:var(--text-muted);">
          Already registered?
          <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in instead</a>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
